name: CodexTime
options:
  bundleIdPrefix: com.sundaynighttt
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "8"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1"
targets:
  CodexTime:
    type: application
    platform: iOS
    sources:
      - path: CodexTimeApp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sundaynighttt.codextime.ios
        PRODUCT_NAME: CodexTime
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
    dependencies:
      - target: CodexTimeWidgetExtension

  CodexTimeWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: CodexTimeWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sundaynighttt.codextime.ios.widget
        PRODUCT_NAME: CodexTimeWidget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Widget.entitlements

  CodexTimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CodexTimeTests
    dependencies:
      - target: CodexTime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sundaynighttt.codextime.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CodexTime.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/CodexTime"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  CodexTime:
    build:
      targets:
        CodexTime: all
        CodexTimeWidgetExtension: all
        CodexTimeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CodexTimeTests
