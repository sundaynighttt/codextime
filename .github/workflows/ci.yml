name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS Swift
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run unit tests
        run: swift test --package-path macos

      - name: Build app bundle
        run: ./macos/scripts/build-macos.sh

      - name: Verify app signature
        run: codesign --verify --deep --strict "macos/dist/Codex Usage Monitor.app"

  windows:
    name: Windows PowerShell
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run parser tests
        run: .\windows\test-parser.ps1
