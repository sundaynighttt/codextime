name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS Swift
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run unit tests
        run: swift test --package-path macos

      - name: Build app bundle
        run: ./macos/scripts/build-macos.sh

      - name: Verify app signature
        run: codesign --verify --deep --strict "macos/dist/Codex Usage Monitor.app"

  ios:
    name: iPhone widget
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and run unit tests
        run: ./ios/scripts/test-ios.sh

  windows:
    name: Windows WPF
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and run parser tests
        run: .\windows\test-parser.ps1
