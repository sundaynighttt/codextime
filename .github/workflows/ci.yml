name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS Swift
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run unit tests
        run: swift test --package-path macos

      - name: Build app bundle
        run: ./macos/scripts/build-macos.sh

      - name: Verify app signature
        run: codesign --verify --deep --strict "macos/dist/Codex Usage Monitor.app"

  ios:
    name: iPhone widget
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and run unit tests
        run: ./ios/scripts/test-ios.sh

  windows:
    name: Windows WPF
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and run parser tests
        run: .\windows\test-parser.ps1

      - name: Package and verify standalone app
        run: |
          .\windows\package-windows.ps1 -Version 0.4.1
          Expand-Archive -Path dist\CodexTime-Windows-0.4.1.zip -DestinationPath "$env:RUNNER_TEMP\codextime-package"
          $executable = "$env:RUNNER_TEMP\codextime-package\CodexTime-Windows-0.4.1\CodexTime.exe"
          $test = Start-Process -FilePath $executable -ArgumentList '--self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw 'Published application self-test failed.' }
          $previewPath = Join-Path $env:RUNNER_TEMP 'codextime-windows-previews'
          $preview = Start-Process -FilePath $executable -ArgumentList @('--render-preview', $previewPath) -Wait -PassThru
          if ($preview.ExitCode -ne 0) { throw 'Published application preview failed.' }
          $zip = Get-Item dist\CodexTime-Windows-0.4.1.zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip.FullName).Hash.ToLowerInvariant()
          "$hash  $($zip.Name)" | Out-File -FilePath dist\SHA256SUMS-Windows.txt -Encoding ascii

      - name: Retain Windows package and synthetic previews
        uses: actions/upload-artifact@v4
        with:
          name: windows-0.4.1-validation
          path: |
            dist/CodexTime-Windows-0.4.1.zip
            dist/SHA256SUMS-Windows.txt
            ${{ runner.temp }}/codextime-windows-previews/*.png
          if-no-files-found: error
