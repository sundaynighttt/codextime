name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        default: 0.1.0

permissions:
  contents: write

jobs:
  macos:
    name: Package macOS DMG
    runs-on: macos-latest
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        run: swift test --package-path macos

      - name: Import Developer ID certificate
        if: ${{ env.MACOS_CERTIFICATE_P12 != '' && env.APPLE_DEVELOPER_IDENTITY != '' }}
        run: |
          certificate_path="$RUNNER_TEMP/codextime-certificate.p12"
          keychain_path="$RUNNER_TEMP/codextime-signing.keychain-db"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate_path"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          echo "CODEXTIME_SIGN_IDENTITY=$APPLE_DEVELOPER_IDENTITY" >> "$GITHUB_ENV"

      - name: Configure Apple notarization
        if: ${{ env.MACOS_CERTIFICATE_P12 != '' && env.APPLE_DEVELOPER_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_APP_PASSWORD != '' && env.APPLE_TEAM_ID != '' }}
        run: |
          xcrun notarytool store-credentials codextime-notary \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          echo "CODEXTIME_NOTARY_PROFILE=codextime-notary" >> "$GITHUB_ENV"

      - name: Package DMG
        run: ./macos/scripts/package-macos.sh '${{ steps.version.outputs.value }}'

      - name: Verify app and DMG
        run: |
          codesign --verify --deep --strict 'macos/dist/Codex Usage Monitor.app'
          hdiutil verify 'dist/CodexTime-macOS-${{ steps.version.outputs.value }}.dmg'

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Package Windows ZIP
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run parser tests
        run: .\windows\test-parser.ps1

      - name: Package ZIP
        run: .\windows\package-windows.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Verify ZIP
        run: |
          Expand-Archive -Path 'dist\CodexTime-Windows-${{ steps.version.outputs.value }}.zip' -DestinationPath "$env:RUNNER_TEMP\codextime-release"
          if (-not (Test-Path "$env:RUNNER_TEMP\codextime-release\CodexTime-Windows-${{ steps.version.outputs.value }}\install.ps1")) {
            throw 'install.ps1 is missing from the Windows release package.'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd artifacts && sha256sum * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
