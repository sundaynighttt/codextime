name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        default: 0.3.1

permissions:
  contents: write

jobs:
  macos:
    name: Package signed universal macOS DMG
    runs-on: macos-latest
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CODEXTIME_PUBLIC_RELEASE: '1'
      CODEXTIME_SIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
      CODEXTIME_NOTARY_PROFILE: codextime-notary
    steps:
      - uses: actions/checkout@v4

      - name: Require signing and notarization configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD MACOS_PROVISIONING_PROFILE_BASE64 MACOS_KEYCHAIN_PASSWORD APPLE_DEVELOPER_IDENTITY APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required release secret is missing: $name"
              missing=1
            fi
          done
          if [[ "$missing" != 0 ]]; then
            exit 1
          fi

      - name: Resolve version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$REQUESTED_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo '::error::Version must be x.y.z.'
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Run tests
        env:
          CODEX_LIVE_TEST: '0'
        run: |
          swift test --package-path Shared/UsageSync
          swift test --package-path macos

      - name: Import Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          certificate_path="$RUNNER_TEMP/codextime-certificate.p12"
          keychain_path="$RUNNER_TEMP/codextime-signing.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate_path"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$keychain_path"
          rm -f "$certificate_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path"
          echo "CODEXTIME_NOTARY_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Prepare Production CloudKit profile
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          profile_path="$RUNNER_TEMP/codextime-cloudkit.provisionprofile"
          printf '%s' "$MACOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"
          python3 macos/scripts/validate-cloudkit-profile.py "$profile_path"
          echo "CODEXTIME_PROVISIONING_PROFILE=$profile_path" >> "$GITHUB_ENV"

      - name: Configure Apple notarization
        shell: bash
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "$CODEXTIME_NOTARY_PROFILE" \
            --keychain "$CODEXTIME_NOTARY_KEYCHAIN" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"

      - name: Package DMG
        env:
          CODEXTIME_VERSION: ${{ steps.version.outputs.value }}
        run: ./macos/scripts/package-macos.sh "$CODEXTIME_VERSION"

      - name: Verify app and DMG
        env:
          CODEXTIME_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          app='macos/dist/Codex Usage Monitor.app'
          dmg="dist/CodexTime-macOS-$CODEXTIME_VERSION.dmg"
          lipo "$app/Contents/MacOS/CodexUsageMonitor" -verify_arch arm64
          lipo "$app/Contents/MacOS/CodexUsageMonitor" -verify_arch x86_64
          codesign --verify --deep --strict "$app"
          codesign --verify --strict "$dmg"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          spctl --assess --type execute --verbose=2 "$app"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          hdiutil verify "$dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/*.dmg
          if-no-files-found: error

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/codextime-certificate.p12" "$RUNNER_TEMP/codextime-cloudkit.provisionprofile"
          if [[ -f "$RUNNER_TEMP/codextime-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/codextime-signing.keychain-db"
          fi

  windows:
    name: Package Windows ZIP
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$REQUESTED_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo '::error::Version must be x.y.z.'
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build and run parser tests
        run: .\windows\test-parser.ps1

      - name: Package ZIP
        env:
          CODEXTIME_VERSION: ${{ steps.version.outputs.value }}
        run: .\windows\package-windows.ps1 -Version $env:CODEXTIME_VERSION

      - name: Verify ZIP
        env:
          CODEXTIME_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $artifactName = "CodexTime-Windows-$env:CODEXTIME_VERSION"
          Expand-Archive -Path "dist\$artifactName.zip" -DestinationPath "$env:RUNNER_TEMP\codextime-release"
          if (-not (Test-Path "$env:RUNNER_TEMP\codextime-release\$artifactName\install.ps1")) {
            throw 'install.ps1 is missing from the Windows release package.'
          }
          if (-not (Test-Path "$env:RUNNER_TEMP\codextime-release\$artifactName\CodexTime.exe")) {
            throw 'CodexTime.exe is missing from the Windows release package.'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Create draft GitHub Release
    if: github.ref_type == 'tag'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd artifacts && sha256sum * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --verify-tag
